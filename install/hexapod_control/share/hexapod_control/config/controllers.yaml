# controllers.yaml
controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true

# Standard joint state broadcaster
joint_state_broadcaster:
  ros__parameters: {}

# 18 Joint position controllers (hip/knee/ankle for legs 1..6)
# Tune the PID numbers below as needed (conservative starting values)
hip_1_joint_position_controller:
  type: position_controllers/JointPositionController
  joint: hip_1_joint
  ros__parameters:
    pid: {p: 30.0, i: 0.0, d: 1.0}

knee_1_joint_position_controller:
  type: position_controllers/JointPositionController
  joint: knee_1_joint
  ros__parameters:
    pid: {p: 50.0, i: 0.0, d: 1.5}

ankle_1_joint_position_controller:
  type: position_controllers/JointPositionController
  joint: ankle_1_joint
  ros__parameters:
    pid: {p: 20.0, i: 0.0, d: 0.5}

