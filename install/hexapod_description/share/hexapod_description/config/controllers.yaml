controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hexapod_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

hexapod_joint_trajectory_controller:
  ros__parameters:
    joints:
      # Leg 1
      - hip_1_joint
      - knee_1_joint
      - ankle_1_joint

      # Leg 2
      - hip_2_joint
      - knee_2_joint
      - ankle_2_joint

      # Leg 3
      - hip_3_joint
      - knee_3_joint
      - ankle_3_joint

      # Leg 4
      - hip_4_joint
      - knee_4_joint
      - ankle_4_joint

      # Leg 5
      - hip_5_joint
      - knee_5_joint
      - ankle_5_joint

      # Leg 6
      - hip_6_joint
      - knee_6_joint
      - ankle_6_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 250.0
    action_monitor_rate: 100.0

    allow_partial_joints_goal: true
    open_loop_control: true

    constraints:
      stopped_velocity_tolerance: 0.8
      goal_time: 0.3

      # Per-joint constraints
      hip_1_joint:
        trajectory: 0.8
        goal: 0.8
      knee_1_joint:
        trajectory: 0.8
        goal: 0.8
      ankle_1_joint:
        trajectory: 0.8
        goal: 0.8

      hip_2_joint:
        trajectory: 0.8
        goal: 0.8
      knee_2_joint:
        trajectory: 0.8
        goal: 0.8
      ankle_2_joint:
        trajectory: 0.8
        goal: 0.8

      hip_3_joint:
        trajectory: 0.8
        goal: 0.8
      knee_3_joint:
        trajectory: 0.8
        goal: 0.8
      ankle_3_joint:
        trajectory: 0.8
        goal: 0.8

      hip_4_joint:
        trajectory: 0.8
        goal: 0.8
      knee_4_joint:
        trajectory: 0.8
        goal: 0.8
      ankle_4_joint:
        trajectory: 0.8
        goal: 0.8

      hip_5_joint:
        trajectory: 0.8
        goal: 0.8
      knee_5_joint:
        trajectory: 0.8
        goal: 0.8
      ankle_5_joint:
        trajectory: 0.8
        goal: 0.8

      hip_6_joint:
        trajectory: 0.8
        goal: 0.8
      knee_6_joint:
        trajectory: 0.8
        goal: 0.8
      ankle_6_joint:
        trajectory: 0.8
        goal: 0.8
